<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#05070f"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>
  <polygon points="50,18 78,74 65,74 57,58 43,58 35,74 22,74" fill="none" stroke="url(#grad)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
  <polyline points="46,52 50,42 54,52" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="40" r="3" fill="#00F0FF" filter="url(#glow)"/>
</svg>
