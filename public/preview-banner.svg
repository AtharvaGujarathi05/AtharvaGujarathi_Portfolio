<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="50%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#cyan-glow)"/>
  <rect width="1200" height="630" fill="url(#purple-glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Content -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="360" height="36" rx="18" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-opacity="0.3"/>
    <text x="24" y="23" font-family="monospace" font-size="14" fill="#00F0FF" letter-spacing="2">AI • DATA SCIENCE • ENGINEERING</text>
    
    <text x="0" y="100" font-family="system-ui, sans-serif" font-weight="800" font-size="64" fill="url(#text-grad)" letter-spacing="-1">ATHARVA GUJARATHI</text>
    <text x="0" y="160" font-family="system-ui, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">
      Building intelligent experiences at the intersection of AI, data and technology.
    </text>
  </g>
</svg>
